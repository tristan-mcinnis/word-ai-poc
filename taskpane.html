<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word pane</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Word pane</h1>
  <select id="provider" title="Model provider"></select>
</header>
<main>
  <section class="card">
    <div class="label">Selection</div>
    <div id="original" class="empty">Nothing captured. Select a paragraph in the document, then press Read selection.</div>
  </section>

  <section class="card">
    <div class="label">Action</div>
    <div class="row">
      <button data-mode="rewrite">Rewrite</button>
      <button data-mode="shorten">Shorten</button>
      <button data-mode="tighten">Tighten</button>
      <button data-mode="plain">Plain</button>
      <button data-mode="formal">Formal</button>
      <button data-mode="bullets">Bullets</button>
      <button data-mode="summary">Summarise</button>
    </div>
    <textarea id="instruction" placeholder="Or write your own instruction, for example: cut the second paragraph, keep the figures, voice of a partner."></textarea>
    <div class="row" style="margin-top:8px">
      <input id="language" class="lang" placeholder="Language (optional)">
    </div>
  </section>

  <section class="card">
    <div class="label">Result</div>
    <div id="preview" class="thinking">No result yet.</div>
  </section>
</main>
<footer>
  <button id="read" class="primary">Read selection</button>
  <button id="run" disabled>Run</button>
  <button id="apply" disabled>Replace selection</button>
  <button id="insert" disabled>Insert below</button>
  <button id="stop" disabled>Stop</button>
</footer>
<p id="status">Starting…</p>
<script src="app.js"></script>
</body>
</html>
