<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Editor</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <h1>AI Editor</h1>
    <span id="host-badge" class="host-badge" hidden></span>
    <select id="preview-host" class="preview-host" hidden title="Preview host mode (outside Office)" aria-label="Preview host">
      <option value="word">Word</option>
      <option value="excel">Excel</option>
      <option value="powerpoint">PowerPoint</option>
    </select>
  </div>
  <div class="header-actions">
    <button id="keys-btn" class="icon-pill" title="Manage local API keys">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="5.5" cy="10.5" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M7.8 8.2 14 2m-2.5 2.5L13.5 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Keys</span>
    </button>
    <button id="new" class="icon-pill" title="Start a new conversation">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>New</span>
    </button>
  </div>
</header>

<div id="keys-panel" hidden role="dialog" aria-label="Local API keys">
  <div class="keys-head">
    <strong>API keys</strong>
    <button id="keys-close" type="button" class="micro-btn" aria-label="Close">&times;</button>
  </div>
  <div id="keys-list" class="keys-list"></div>
  <form id="keys-form" class="keys-form">
    <label for="keys-provider" class="keys-label">Provider</label>
    <select id="keys-provider"></select>
    <label for="keys-input" class="keys-label" id="keys-input-label">API key</label>
    <input id="keys-input" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your API key…">
    <div class="keys-actions">
      <button type="submit" class="btn-primary">Save key</button>
      <button type="button" id="keys-remove" class="btn-secondary" hidden>Remove</button>
    </div>
    <p class="keys-note">Stored locally in <code>~/.config/word-poc/.env</code> (chmod 600). Never sent back to the browser.</p>
  </form>
</div>

<main id="transcript" aria-live="polite"></main>

<div id="dock">
  <div id="toast" hidden role="status">
    <span id="toast-text"></span>
    <button id="toast-close" aria-label="Dismiss">&times;</button>
  </div>

  <div id="actions-menu" hidden role="listbox" aria-label="Quick actions"></div>

  <div id="composer-card">
    <div id="context-row">
      <button id="context-pill" type="button" title="Click to switch context scope">
        <span id="context-badge"></span>
        <span id="context-preview"></span>
      </button>
      <button id="refresh" type="button" class="micro-btn" title="Refresh context">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.65M13.5 2.5v2.4h-2.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <textarea id="input" rows="1" placeholder="Ask anything, or type / for actions…"></textarea>

    <div id="composer-bar">
      <div class="bar-left">
        <select id="provider" title="Switch model"></select>
        <button id="actions-btn" type="button" class="tool-btn" title="Quick workflows & actions (or type /)">
          <span>/</span>
        </button>
        <button id="secondary-btn" type="button" class="tool-btn" hidden>
          <span></span>
        </button>
        <button id="mode-btn" type="button" class="tool-btn" title="Edit permission: Ask before edits vs Auto-apply">
          <span>Ask</span>
        </button>
      </div>
      <div class="bar-right">
        <button id="send" type="button" class="send-btn" title="Send (Enter)" aria-label="Send">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 13V3.5M4 7.5 8 3.5l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="stop" type="button" class="send-btn stop-btn" hidden title="Stop generating (Esc)" aria-label="Stop">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.5"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
