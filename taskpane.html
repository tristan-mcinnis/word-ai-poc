<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word pane</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Word pane</h1>
  <select id="provider" title="Model"></select>
  <button id="new" class="ghost" title="Clear this conversation">New</button>
</header>

<div id="transcript">
  <div class="turn assistant"><div class="bubble">Ask for a change to the document. Selecting text in Word attaches it automatically as context.</div></div>
</div>

<div id="contextbar">
  <span>Context</span>
  <span id="context" class="none">no selection</span>
  <button id="refresh" class="ghost" title="Read the selection again">Refresh</button>
</div>

<div id="chips">
  <button data-send="Tighten this. Remove filler and hedging, keep the meaning.">Tighten</button>
  <button data-send="Shorten this by about a third. Keep every fact that matters.">Shorten</button>
  <button data-send="Rewrite this so it reads clearly and directly, same meaning, same length.">Rewrite</button>
  <button data-send="Make this plainer: short sentences, common words, one idea each.">Plain</button>
  <button data-send="Turn this into a short bullet list, one idea per bullet.">Bullets</button>
  <button data-send="Summarise this in two sentences.">Summarise</button>
</div>

<div id="composer">
  <textarea id="input" placeholder="Or say what to do, for example: keep the figures but drop the second paragraph. Then say shorter."></textarea>
  <button id="send">Send</button>
  <button id="stop" hidden>Stop</button>
</div>

<p id="status">Starting…</p>
<script src="app.js"></script>
</body>
</html>
