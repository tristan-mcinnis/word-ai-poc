<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Editor</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span id="host-badge" class="host-badge" hidden></span>
    <select id="preview-host" class="preview-host" hidden title="Preview host mode (outside Office)" aria-label="Preview host">
      <option value="word">Word</option>
      <option value="excel">Excel</option>
      <option value="powerpoint">PowerPoint</option>
    </select>
  </div>
  <div class="header-actions">
    <button id="history-btn" class="icon-btn" title="Saved chat history" aria-label="Saved chat history">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5.8" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.8V8l2.2 1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="skills-btn" class="icon-btn" title="Global AGENTS.md, Skills & MCP Tools" aria-label="Skills and MCP tools">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.8 9.6 6.4 14.2 8 9.6 9.6 8 14.2 6.4 9.6 1.8 8 6.4 6.4 8 1.8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
    <button id="keys-btn" class="icon-btn" title="Manage local API keys" aria-label="API keys">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="5.5" cy="10.5" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M7.8 8.2 14 2m-2.5 2.5L13.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="theme-btn" class="icon-btn" title="Local brand theme for blank docs & slides" aria-label="Brand theme">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2a6 6 0 1 0 0 12c1.1 0 1.6-.6 1.6-1.3 0-.4-.2-.7-.4-1-.2-.3-.4-.6-.4-1 0-.7.6-1.2 1.3-1.2H11a3 3 0 0 0 3-3C14 3.9 11.3 2 8 2Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><circle cx="5.5" cy="7" r=".8" fill="currentColor"/><circle cx="7.8" cy="5.2" r=".8" fill="currentColor"/><circle cx="10.3" cy="6.4" r=".8" fill="currentColor"/></svg>
    </button>
    <button id="new" class="icon-pill" title="Start a new conversation">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>New</span>
    </button>
  </div>
</header>

<div id="history-panel" hidden role="dialog" aria-label="Saved chat history">
  <div class="keys-head">
    <strong>Chat History</strong>
    <button id="history-close" type="button" class="micro-btn" aria-label="Close">&times;</button>
  </div>
  <div id="history-list" class="skills-section"></div>
  <p class="keys-note">Saved locally in <code>~/.config/word-poc/sessions/</code> (chmod 600).</p>
</div>

<div id="skills-panel" hidden role="dialog" aria-label="Global AGENTS.md, Skills and MCP Tools">
  <div class="keys-head">
    <strong>AGENTS.md, Skills &amp; MCP</strong>
    <div class="skills-head-actions">
      <button id="skills-refresh" type="button" class="micro-btn" title="Rescan global AGENTS.md, skills, and MCP servers" aria-label="Refresh skills">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.65M13.5 2.5v2.4h-2.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="skills-close" type="button" class="micro-btn" aria-label="Close">&times;</button>
    </div>
  </div>
  <div id="agents-section" class="skills-section"></div>
  <div id="skills-section" class="skills-section"></div>
  <div id="mcp-section" class="skills-section"></div>
  <p id="skills-paths-note" class="keys-note"></p>
</div>

<div id="keys-panel" hidden role="dialog" aria-label="Local API keys">
  <div class="keys-head">
    <strong>API keys</strong>
    <button id="keys-close" type="button" class="micro-btn" aria-label="Close">&times;</button>
  </div>
  <div id="keys-list" class="keys-list"></div>
  <form id="keys-form" class="keys-form">
    <label for="keys-provider" class="keys-label">Provider</label>
    <select id="keys-provider"></select>
    <label for="keys-input" class="keys-label" id="keys-input-label">API key</label>
    <input id="keys-input" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your API key…">
    <div class="keys-actions">
      <button type="submit" class="btn-primary">Save key</button>
      <button type="button" id="keys-remove" class="btn-secondary" hidden>Remove</button>
    </div>
    <p class="keys-note">Stored locally in <code>~/.config/word-poc/.env</code> (chmod 600). Never sent back to the browser.</p>
  </form>
</div>

<div id="theme-panel" hidden role="dialog" aria-label="Local brand theme">
  <div class="keys-head">
    <strong>Brand Theme</strong>
    <button id="theme-close" type="button" class="micro-btn" aria-label="Close">&times;</button>
  </div>
  <form id="theme-form" class="keys-form">
    <label class="theme-toggle-row">
      <input id="theme-enabled" type="checkbox">
      <span>Apply theme on blank docs &amp; slides</span>
    </label>
    <div class="theme-grid">
      <div>
        <label for="theme-font" class="keys-label">Body font</label>
        <input id="theme-font" type="text" placeholder="e.g. DM Sans, Arial">
      </div>
      <div>
        <label for="theme-heading-font" class="keys-label">Heading font</label>
        <input id="theme-heading-font" type="text" placeholder="Same as body">
      </div>
      <div>
        <label for="theme-font-size" class="keys-label">Body size (pt)</label>
        <input id="theme-font-size" type="text" placeholder="10.5">
      </div>
      <div>
        <label for="theme-table-size" class="keys-label">Table size (pt)</label>
        <input id="theme-table-size" type="text" placeholder="9">
      </div>
      <div>
        <label for="theme-heading-color" class="keys-label">Heading color</label>
        <input id="theme-heading-color" type="text" placeholder="#18181B">
      </div>
      <div>
        <label for="theme-color" class="keys-label">Body color</label>
        <input id="theme-color" type="text" placeholder="#1F2937">
      </div>
      <div>
        <label for="theme-table-fill" class="keys-label">Table header fill</label>
        <input id="theme-table-fill" type="text" placeholder="#F3F4F6">
      </div>
      <div>
        <label for="theme-table-color" class="keys-label">Table header text</label>
        <input id="theme-table-color" type="text" placeholder="#18181B">
      </div>
    </div>
    <div class="keys-actions">
      <button type="submit" class="btn-primary">Save theme</button>
      <button type="button" id="theme-reset" class="btn-secondary">Reset</button>
    </div>
    <p class="keys-note">Saved locally in <code>~/.config/word-poc/config.json</code>. Never committed to git.</p>
  </form>
</div>

<main id="transcript" aria-live="polite"></main>

<div id="dock">
  <div id="toast" hidden role="status">
    <span id="toast-text"></span>
    <button id="toast-close" aria-label="Dismiss">&times;</button>
  </div>

  <div id="actions-menu" hidden role="listbox" aria-label="Quick actions"></div>

  <div id="composer-card">
    <div id="context-row">
      <button id="context-pill" type="button" title="Click to switch context scope">
        <span id="context-badge"></span>
        <span id="context-preview"></span>
      </button>
      <button id="refresh" type="button" class="micro-btn" title="Refresh context">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.65M13.5 2.5v2.4h-2.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div id="active-skills-row" hidden></div>

    <textarea id="input" rows="1" placeholder="Ask anything, or type / for actions…"></textarea>

    <div id="composer-bar">
      <div class="bar-left">
        <select id="provider" title="Switch model"></select>
        <button id="actions-btn" type="button" class="tool-btn" title="Quick workflows & actions (or type /)">
          <span>/</span>
        </button>
        <button id="secondary-btn" type="button" class="tool-btn" hidden>
          <span></span>
        </button>
        <button id="mode-btn" type="button" class="tool-btn" title="Edit permission: Ask before edits vs Auto-apply">
          <span>Ask</span>
        </button>
      </div>
      <div class="bar-right">
        <button id="send" type="button" class="send-btn" title="Send (Enter)" aria-label="Send">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 13V3.5M4 7.5 8 3.5l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="stop" type="button" class="send-btn stop-btn" hidden title="Stop generating (Esc)" aria-label="Stop">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.5"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
