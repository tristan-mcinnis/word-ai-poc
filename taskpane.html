<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local editor POC</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><style>body{font:14px -apple-system,sans-serif;padding:18px;color:#222;background:#faf9f6}button,input,textarea{font:inherit;margin:6px 0;padding:8px;box-sizing:border-box;width:100%}textarea{height:150px}button{cursor:pointer}small{color:#555}#status{white-space:pre-wrap}label{display:block;margin-top:14px}</style></head><body><h2>Local editor</h2><small>POC. Only your selected text. Apply replaces plain text, not formatting. Try on a scratch document.</small><button id="read" disabled>1. Read selection</button><label>Original<textarea id="original" readonly></textarea></label><button id="demo" disabled>2. Tidy whitespace</button><label>Preview<textarea id="preview"></textarea></label><button id="apply" disabled>3. Apply to original selection</button><p id="status" role="status">Waiting for Word…</p><script src="app.js"></script></body></html>
